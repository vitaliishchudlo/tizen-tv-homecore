[project]
name = "tizen-tv-homecore"
version = "0.1.0"
description = "Core для керування Samsung Tizen ТВ (сон, яскравість, YouTube) з домашнього сервера"
requires-python = ">=3.10"
dependencies = [
    "samsungtvws",
    "pyytlounge",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tizen-homecore = "tizen_tv_homecore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
